<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MEV Core Engine</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #020617;
        color: #e2e8f0;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(28rem, calc(100% - 2rem));
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MEV Core Engine</h1>
      <p id="status">Menyalakan server lokal di http://localhost:4100 …</p>
    </main>
    <script>
      const local = "http://localhost:4100/engine";
      const status = document.getElementById("status");
      async function ready() {
        try {
          const res = await fetch(local, { method: "GET", cache: "no-store" });
          return res.ok;
        } catch {
          return false;
        }
      }
      async function waitForCore() {
        for (let i = 0; i < 90; i += 1) {
          if (await ready()) {
            location.replace(local);
            return;
          }
          status.textContent = "Menunggu backend lokal (" + (i + 1) + "/90)…";
          await new Promise((resolve) => setTimeout(resolve, 1000));
        }
        status.textContent =
          "Backend lokal tidak menjawab di port 4100. Tutup aplikasi lalu buka lagi MEV Core Engine.";
      }
      waitForCore();
    </script>
  </body>
</html>
