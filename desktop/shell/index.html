<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MEV Core Engine</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #020617;
        color: #e2e8f0;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(28rem, calc(100% - 2rem));
        text-align: center;
      }
      a {
        color: #6ee7b7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MEV Core Engine</h1>
      <p id="status">Menyalakan server lokal…</p>
      <p><a href="http://127.0.0.1:4100/">Buka http://127.0.0.1:4100</a></p>
    </main>
    <script>
      const local = "http://127.0.0.1:4100/";
      const live = "https://mevarbtech.netlify.app/engine";
      const status = document.getElementById("status");
      async function localReady() {
        try {
          const res = await fetch(local, { method: "GET", cache: "no-store" });
          const text = await res.text();
          return res.ok && !text.includes("belum berjalan di port 3000");
        } catch {
          return false;
        }
      }
      async function openCore() {
        if (await localReady()) {
          status.textContent = "Server lokal siap. Membuka Core Engine…";
          location.replace(local);
          return;
        }
        status.textContent = "Membuka Core Engine online…";
        location.replace(live);
      }
      openCore();
    </script>
  </body>
</html>
